name: PR baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # Pinned commit SHAs make action code changes explicit in review.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and types
        run: |
          pnpm lint
          pnpm typecheck
      - name: Run synthetic unit and integration checks
        run: pnpm test
      - name: Install browser for fixture-only checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser checks
        run: pnpm test:e2e
      - name: Build and inspect the local release
        run: |
          pnpm release:local
          pnpm test:release
          (cd dist && sha256sum --check quoli-*.tar.gz.sha256)
          ! tar -tzf dist/quoli-*.tar.gz | grep -E '(^|/)(\.env(\..*)?|credential|[^/]+\.(sqlite|db)(-[^/]*)?)$'
