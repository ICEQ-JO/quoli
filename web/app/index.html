<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the stored theme before first paint (see web/src/theme.ts).
      (() => {
        var t = "dark";
        var s = null;
        try {
          s = localStorage.getItem("quoli.theme");
          t = s === "dark" || s === "light" ? s : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (_e) {
          t = "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>Quoli</title>
    <meta name="description" content="Quoli teams: see how your team or class uses coding agents, from session summaries members choose to share." />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/class/main.tsx"></script>
  </body>
</html>
